:root{--paper:#f4f3ee;--surface:#fffefa;--ink:#162937;--muted:#657079;--navy:#132633;--navy2:#1c3444;--line:#d8dcd9;--gold:#c5aa7c;--blue:#355e89;--success:#487464;--warn:#937844;--title-size:clamp(1.5rem,3.7vw,4rem);--h2-size:clamp(1.5rem,3vw,3.5rem);--h3-size:clamp(1rem,1.55vw,1.75rem);--body-size:clamp(.875rem,1.17vw,1.3rem);--small-size:clamp(.75rem,.94vw,1rem);--slide-padding:clamp(1.25rem,4.3vw,5.5rem);--content-gap:clamp(.6rem,1.7vh,1.7rem);--element-gap:clamp(.35rem,1vw,1rem);--header-h:clamp(56px,5.8vh,72px);--footer-h:clamp(48px,5.5vh,64px)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;overflow-x:clip}html{scroll-behavior:auto}html:has(body[data-mode=present]){overflow:hidden}body{font-family:'DChain Sans','PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}body[data-mode=present]{overflow:hidden}button,input{font:inherit}button{cursor:pointer}button,a,input{ -webkit-tap-highlight-color:transparent}button{color:inherit;border:0;background:none}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}button:disabled{opacity:.3;cursor:default}a{color:inherit;text-decoration:none}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:500}ul,ol{margin:0;padding:0;list-style:none}button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;vertical-align:middle}button,summary,a{touch-action:manipulation}[hidden]{display:none!important}.serif{font-family:'DChain Serif','Songti SC',serif}.muted{color:var(--muted)}.mono{font-family:'DChain Sans',sans-serif;font-variant-numeric:tabular-nums}.preline{white-space:pre-line}.caps{letter-spacing:.15em}.eyebrow{display:flex;gap:.9em;align-items:center;color:var(--blue);font-size:var(--small-size);letter-spacing:.08em;margin-bottom:clamp(10px,1.7vh,22px)}.eyebrow:before{content:'';width:clamp(23px,2.5vw,48px);height:1px;background:currentColor}.dark{background:var(--navy);color:#eeeae2;--line:#ffffff26;--muted:#a4b3ba;--blue:#c5aa7c}.dark .eyebrow{color:var(--gold)}

.slide{width:100vw;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;position:relative;padding-top:var(--header-h);padding-bottom:var(--footer-h)}.slide-content{flex:1;display:flex;flex-direction:column;justify-content:center;max-height:100%;overflow:hidden;padding:clamp(20px,3vh,40px) var(--slide-padding);gap:var(--content-gap)}.slide-head{display:flex;justify-content:space-between;align-items:end;gap:clamp(1rem,3vw,3rem);flex-shrink:0}.slide-head h2{font-size:var(--h2-size);line-height:1.2;letter-spacing:-.045em}.slide-head .subtitle{font-size:var(--body-size);color:var(--muted);line-height:1.6;margin-top:clamp(8px,1vh,14px);max-width:72em}.slide-main{flex:1;min-height:0}.rule{height:1px;background:var(--line)}.line-heading{display:flex;align-items:center;gap:1em;font-size:var(--small-size);color:var(--muted);letter-spacing:.07em}.line-heading:after{content:'';height:1px;background:var(--line);flex:1}.small{font-size:var(--small-size);line-height:1.6}

const SOURCE=JSON.parse(document.getElementById('source-data').textContent);
const S=(p,i)=>SOURCE[p-1][i].text;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>s.replace(/^●\s*/,'');
const range=(n,start=0)=>Array.from({length:n},(_,i)=>i+start);
const sourceHtml=(p,i,tag='span',cls='')=>`<${tag} data-source="${p}.${i}"${cls?` class="${cls}"`:''}>${esc(clean(S(p,i)))}</${tag}>`;
const moduleData=range(6).map(i=>({number:S(2,16+i*4),title:S(2,17+i*4),status:S(2,18+i*4),lines:S(2,19+i*4).split('\n').map(x=>x.replace(/^·\s*/,''))}));
const statusHtml=t=>`<span class="status ${t==='优化迭代'?'iteration':t==='规划新增'?'planned':''}">${esc(t)}</span>`;
const channels=range(10,23).map(i=>S(3,i));
const slidesMeta=[{id:'overview',title:'平台全景',chapter:0,dark:true},{id:'value',title:'品牌价值',chapter:0},{id:'capabilities',title:'六大模块全景',chapter:1},{id:'architecture',title:'平台总体架构',chapter:2},{id:'collaboration',title:'KOCKOH 双端协作',chapter:3},{id:'journey',title:'KOCKOH 运营闭环',chapter:3,dark:true},{id:'ai',title:'AI 赋能 KOH',chapter:4},{id:'roadmap',title:'建设路径',chapter:4,dark:true}];
const chapterMeta=[{id:'overview',title:'平台全景',slide:0},{id:'capabilities',title:'功能蓝图',slide:2},{id:'architecture',title:'总体架构',slide:3},{id:'collaboration',title:'KOCKOH',slide:4},{id:'ai',title:'战略演进',slide:6}];
const slide=(idx,body)=>`<section class="slide ${slidesMeta[idx].dark?'dark':''}" id="scene-${slidesMeta[idx].id}" aria-label="${slidesMeta[idx].title}"${idx?' hidden':''}><div class="slide-content">${body}</div></section>`;
const heading=(eyebrow,title,subtitle='',aside='')=>`<div class="slide-head reveal"><div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2>${subtitle?`<p class="subtitle">${subtitle}</p>`:''}</div>${aside}</div>`;
function architectureHtml(reader=false){const v=(i,tag='span',cls='')=>reader?sourceHtml(3,i,tag,cls):`<${tag} class="${cls}">${esc(S(3,i))}</${tag}>`;
 const row=(key,index,content,kind,number)=>`<div class="arch-row" data-layer="${key}">${reader?'<div':`<button aria-pressed="false" aria-label="聚焦${S(3,index)}"`} class="layer-label"${reader?'':` data-focus-layer="${key}"`}><small>${number}</small>${v(index)}</${reader?'div':'button'}><div class="arch-field ${kind}">${content}</div></div>`;
 return `<div class="architecture ${reader?'read-arch':''}"${reader?'':' id="architecture-map" data-focus="all"'}>`+row('applications',2,range(3).map(i=>`<div class="arch-unit">${v(6+i*2,'h3')}${v(7+i*2,'p')}</div>`).join(''),'applications','01')+row('capabilities',3,range(5).map(i=>`<div class="arch-unit">${v(12+i*2,'h3')}${v(13+i*2,'p')}</div>`).join(''),'capabilities','02')+row('data',4,v(22,'h3')+`<div class="channel-grid">${range(10,23).map(i=>v(i)).join('')}</div>`,'data-field','03')+row('matrix',5,range(6,35).map(i=>v(i)).join(''),'matrix-field','04')+`</div>`;
}
let content='';
content+=slide(0,`<div class="overview-layout slide-main"><div class="overview-copy reveal"><p class="eyebrow">${S(1,0)}</p><h1 class="serif">让每一次传播<br>都沉淀为<em>品牌资产</em></h1><p class="overview-description">内容驱动品牌增长<br>五级账号矩阵 × 六大管理模块<br>全链路营销价值闭环</p><div class="overview-stats"><div><strong>5</strong><small>级</small><label>账号矩阵</label></div><div><strong>6</strong><small>大</small><label>管理模块</label></div><div><strong>10</strong><small>大</small><label>覆盖渠道</label></div></div></div><div class="platform-map reveal" aria-label="账号矩阵、平台能力中枢与核心能力全景图"><div class="map-actors">${[['KOB / KOA','品牌层'],['KOE','员工层'],['KOS','门店层'],['KOC / KOH','用户层'],['MCN','MCN层']].map(([c,n])=>`<div><b>${c}</b><span>${n}</span></div>`).join('')}</div><svg class="map-bus" viewBox="0 0 1000 50" preserveAspectRatio="none" aria-hidden="true"><path d="M100 0V25H900V0M300 0V25M500 0V50M700 0V25"/><circle cx="500" cy="25" r="3" fill="#c5aa7c" stroke="none"/></svg><div class="map-box"><div class="map-box-title"><strong>D智链</strong><small>平台能力中枢</small></div><div class="module-network">${moduleData.map((m,i)=>`<button class="module-node" data-module="${i}" aria-label="查看${m.title}"><span class="number">${m.number}</span><strong>${m.title}</strong><span class="node-arrow" aria-hidden="true">↗</span></button>`).join('')}</div></div><div class="map-capabilities"><span>内容创作能力</span><span>任务管理 · 多矩阵触达</span><span>数据分析能力</span></div><p class="map-baseline">${S(1,52)}</p></div></div>`);
content+=slide(1,heading('01 / 平台价值','从内容生产，到价值转化',S(1,52))+`<div class="value-layout slide-main"><div class="value-pillars reveal">${[37,40,43].map((i,n)=>`<div class="value-pillar"><p class="pillar-no">0${n+1}</p><h3>${S(1,i)}</h3><p>${S(1,i+1)}</p></div>`).join('')}</div><div class="closed-chain reveal"><div class="line-heading">${S(1,50)}</div><div class="chain-nodes">${S(1,51).split(' → ').map(t=>`<div class="chain-node">${t}</div>`).join('')}</div></div><div class="brand-values reveal">${range(4,46).map(i=>{const x=S(1,i).split('，');return `<p><strong>${x[0]}</strong>${x[1]}</p>`}).join('')}</div></div>`);
content+=slide(2,heading('02 / 功能蓝图','六大模块，构建平台能力全景',S(2,4),`<div class="status-legend">${[1,2,3].map(i=>statusHtml(S(2,i))).join('')}</div>`)+`<div class="cap-layout slide-main reveal"><div class="cap-tablist" role="tablist" aria-label="六大模块" aria-orientation="vertical">${moduleData.map((m,i)=>`<button class="cap-tab" role="tab" id="cap-tab-${i}" aria-controls="cap-panel" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-cap="${i}"><span class="tab-no">${m.number}</span><strong>${m.title}</strong><span class="tab-arrow">↗</span></button>`).join('')}</div><div class="cap-panel" id="cap-panel" role="tabpanel" aria-labelledby="cap-tab-0" tabindex="0"></div></div><div class="business-strip reveal"><span>业务流程</span>${range(5).map(i=>`<div class="business-step"><strong>${S(2,6+i*2)}</strong><small>${S(2,7+i*2)}</small></div>`).join('')}</div><p class="channel-line">${S(2,40).split('｜')[0]}</p>`);
content+=slide(3,heading('03 / 系统架构',S(3,0),'应用入口、平台能力、数据底座与矩阵生态',`<button class="reset-focus" id="reset-focus">显示全部层级</button>`)+`<div class="slide-main reveal">${architectureHtml()}</div><div class="architecture-note"><span>${S(3,33)}</span><span>点击左侧层级聚焦</span></div>`);
content+=slide(4,heading('04 / KOCKOH 产品蓝图','以内容任务为纽带',S(4,2),`<div class="dual-stats"><span class="stat-intro">930投入使用以来<br>已导入</span><div><strong>2300+</strong><small>用户名单</small></div><div><strong>3700+</strong><small>媒体账号</small></div></div>`)+`<div class="dual-layout slide-main reveal"><div><h3 class="dual-title">${S(4,3)}</h3><div class="b-functions">${range(8).map(i=>`<div class="b-function"><h3><span class="num">${S(4,5+i*3)}</span>${S(4,6+i*3)}</h3><p>${S(4,7+i*3)}</p></div>`).join('')}</div></div><div class="c-functions"><h3 class="dual-title">${S(4,4)}</h3>${range(3).map(i=>`<div class="c-function"><h3><span class="num">${S(4,29+i*3)}</span>${S(4,30+i*3)}</h3><p>${S(4,31+i*3)}</p></div>`).join('')}</div></div>`);
content+=slide(5,heading('04 / KOCKOH 运营闭环','从创建任务，到结算收益',S(4,1)+S(4,2))+`<div class="journey-layout slide-main"><div class="journey-path reveal" aria-label="任务流程">${range(6,46).map((i,n)=>`<div class="journey-node"><span class="step-no">0${n+1}</span><span class="journey-dot"></span><h3>${S(4,i)}</h3></div>`).join('')}</div><p class="journey-motion reveal">${S(4,38)}</p><div class="reveal"><div class="journey-band"><span>${S(4,39)}</span><div class="band-items">${range(5,40).map(i=>`<span>${S(4,i)}</span>`).join('')}</div></div><div class="journey-band"><span>${S(4,45)}</span><div class="band-items">${range(5,55).map(i=>`<span>${S(4,i)}</span>`).join('')}</div></div></div><p class="journey-channels">${S(4,52)}</p></div>`);
content+=slide(6,heading('05 / 战略演进','AI 赋能 KOH 内容生态',S(5,1))+`<div class="ai-layout slide-main reveal"><div class="ai-column"><h3>${S(5,2)}</h3><ul class="pain-list">${range(4,3).map(i=>`<li>${S(5,i)}</li>`).join('')}</ul></div><div class="ai-column"><h3>${S(5,8)}</h3><div class="ai-levers">${range(3).map(i=>`<div class="ai-lever"><span class="lever-no">0${i+1}</span><div><h4>${S(5,10+i*3)}</h4><p>${S(5,11+i*3)}</p></div></div>`).join('')}</div></div><div class="ai-column"><h3>${S(5,19)}</h3><ul class="outcome-list">${range(4,20).map(i=>`<li>${S(5,i)}</li>`).join('')}</ul></div></div>`);
content+=slide(7,`<div class="roadmap-head reveal"><div><p class="eyebrow">05 / ${S(5,24)}</p><h2 class="serif">从任务驱动<br>到 <span style="color:var(--gold)">AI 赋能</span></h2></div><div class="goal"><small>${S(5,33)}</small><p class="serif">KOH成为品牌<br>内容自来水军</p></div></div><div class="roadmap slide-main reveal">${range(3).map(i=>{const s=S(5,25+i*3).split(' · '),q=s[0].split(' ');return `<div class="milestone"><div class="quarter">${q[0]}<span>${q[1]}</span></div><h3>${s[1]}</h3><p>${S(5,26+i*3)}</p></div>`}).join('')}</div><div class="roadmap-tail"><span>${S(5,35)}</span><button class="text-button" id="roadmap-read">查看完整产品蓝图 ↗</button></div>`);
document.getElementById('presentation').innerHTML=content;
/* 完整阅读视图：原稿条目逐项定位，页面顺序可重组，内容不删减。 */
const rhead=(p,i)=>sourceHtml(p,i,'h3');
const rlist=(p,start,n)=>`<ul class="read-list">${range(n,start).map(i=>sourceHtml(p,i,'li')).join('')}</ul>`;
const rentry=(p,n,title,desc)=>`<div class="read-entry"><h4>${sourceHtml(p,n,'span','read-num')}${sourceHtml(p,title)}</h4>${sourceHtml(p,desc,'p')}</div>`;
let sections=[];
let r=sourceHtml(1,1,'p')+`<div class="read-value">${sourceHtml(1,53)}</div>`+rhead(1,2)+`<table class="read-table"><tbody>${range(5).map(i=>`<tr><th>${sourceHtml(1,3+i*2)}</th><td>${sourceHtml(1,4+i*2)}</td></tr>`).join('')}</tbody></table>`+rhead(1,13)+`<div class="read-grid">${[14,15].map(i=>sourceHtml(1,i,'p','preline')).join('')}</div>`+rhead(1,16)+`<div class="read-grid">${range(6).map(i=>rentry(1,17+i*3,18+i*3,19+i*3)).join('')}</div>`+rhead(1,35)+`<div class="read-grid three">${range(3).map(i=>rentry(1,36+i*3,37+i*3,38+i*3)).join('')}</div>`+rhead(1,45)+rlist(1,46,4)+rhead(1,50)+sourceHtml(1,51,'p','read-value')+sourceHtml(1,52,'p');sections.push(r);
r=sourceHtml(2,4,'p')+`<div class="status-legend">${[1,2,3].map(i=>sourceHtml(2,i,'span','status '+(i===2?'iteration':i===3?'planned':''))).join('')}</div>`+rhead(2,5)+`<div class="read-flow">${range(5).map(i=>`<div>${sourceHtml(2,6+i*2,'b')}${sourceHtml(2,7+i*2,'small')}</div>`).join('')}</div>`+range(6).map(i=>`<details class="read-module" open><summary><span>${sourceHtml(2,16+i*4,'span','read-num')} ${sourceHtml(2,17+i*4)}</span>${sourceHtml(2,18+i*4,'span','status '+(i===5?'iteration':''))}</summary>${sourceHtml(2,19+i*4,'div','preline')}</details>`).join('')+sourceHtml(2,40,'p','read-value');sections.push(r);
r=architectureHtml(true)+sourceHtml(3,33,'p','read-value');sections.push(r);
r=sourceHtml(4,1,'p')+sourceHtml(4,2,'p')+sourceHtml(4,54,'p','read-value')+rhead(4,3)+`<div class="read-grid">${range(8).map(i=>rentry(4,5+i*3,6+i*3,7+i*3)).join('')}</div>`+rhead(4,4)+`<div class="read-grid three">${range(3).map(i=>rentry(4,29+i*3,30+i*3,31+i*3)).join('')}</div>`+sourceHtml(4,38,'p','read-value')+rhead(4,39)+`<div class="read-flow parallel">${range(5,40).map(i=>sourceHtml(4,i,'div')).join('')}</div>`+`<h3>任务流程</h3><div class="read-flow">${range(6,46).map(i=>sourceHtml(4,i,'div')).join('')}</div>`+rhead(4,45)+`<div class="read-flow parallel">${range(5,55).map(i=>sourceHtml(4,i,'div')).join('')}</div>`+sourceHtml(4,52,'p','read-value');sections.push(r);
r=sourceHtml(5,1,'p')+rhead(5,2)+rlist(5,3,4)+rhead(5,8)+`<div class="read-grid three">${range(3).map(i=>rentry(5,9+i*3,10+i*3,11+i*3)).join('')}</div>`+rhead(5,19)+rlist(5,20,4)+rhead(5,24)+`<div class="read-grid three">${range(3).map(i=>`<div class="read-entry">${sourceHtml(5,25+i*3,'h4')}${sourceHtml(5,26+i*3,'p')}</div>`).join('')}</div>`+rhead(5,33)+sourceHtml(5,34,'p','read-value')+sourceHtml(5,35,'p');sections.push(r);
document.getElementById('read-sections').innerHTML=sections.map((body,i)=>`<section class="read-section" id="read-${chapterMeta[i].id}"><div class="read-section-header">${sourceHtml(i+1,0,'h2')}<button class="fold-section" aria-expanded="true" aria-controls="read-body-${i}">收起 −</button></div><div class="read-section-body" id="read-body-${i}">${body}</div></section>`).join('');
document.getElementById('read-sidebar').innerHTML=`<p class="sidebar-title">完整产品蓝图</p>${chapterMeta.map((c,i)=>`<a href="#read/${c.id}" data-read-chapter="${i}"><small>0${i+1}</small>${c.title}</a>`).join('')}`;
document.getElementById('chapter-nav').innerHTML=chapterMeta.map((c,i)=>`<button data-chapter="${i}" aria-current="${i===0}">${c.title}</button>`).join('');
document.getElementById('slide-dots').innerHTML=slidesMeta.map((s,i)=>`<button data-slide="${i}" aria-label="第${i+1}页：${s.title}" aria-current="${i===0}"></button>`).join('');
class PresentationController{
 constructor(){this.index=0;this.mode='present';this.moduleIndex=0;this.busyUntil=0;this.wheelDelta=0;this.isCompact=()=>innerWidth<1024||innerHeight<600;this.observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('is-visible')}),{threshold:.1});document.querySelectorAll('.slide').forEach(s=>this.observer.observe(s));this.bind();this.updateModule(0);this.route();}
 navigate(index,write=true){this.index=Math.max(0,Math.min(7,index));this.mode='present';document.body.dataset.mode='present';document.body.classList.toggle('on-dark',!!slidesMeta[this.index].dark);document.getElementById('presentation').hidden=false;document.getElementById('reader').hidden=true;['chapter-nav','present-tools','deck-footer'].forEach(id=>document.getElementById(id).hidden=false);document.getElementById('read-tools').hidden=true;document.querySelectorAll('.slide').forEach((s,i)=>{s.hidden=i!==this.index;if(i!==this.index)s.classList.remove('is-visible')});requestAnimationFrame(()=>document.getElementById('scene-'+slidesMeta[this.index].id).classList.add('is-visible'));document.querySelectorAll('[data-chapter]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.chapter)===slidesMeta[this.index].chapter)));document.querySelectorAll('[data-slide]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.slide)===this.index)));document.getElementById('page-position').innerHTML=String(this.index+1).padStart(2,'0')+' <span>/ 08</span>';document.getElementById('footer-caption').textContent=slidesMeta[this.index].title;document.getElementById('prev').disabled=this.index===0;document.getElementById('next').disabled=this.index===7;document.body.scrollTop=0;scrollTo({top:0,behavior:'instant'});if(write)this.hash('present/'+slidesMeta[this.index].id);}
 read(chapter=slidesMeta[this.index].chapter,write=true){this.mode='read';document.body.dataset.mode='read';document.body.classList.remove('on-dark');document.getElementById('presentation').hidden=true;document.getElementById('reader').hidden=false;['chapter-nav','present-tools','deck-footer'].forEach(id=>document.getElementById(id).hidden=true);document.getElementById('read-tools').hidden=false;document.getElementById('present-mode').hidden=this.isCompact();this.setSection(chapter,true);this.markReadChapter(chapter);if(write)this.hash('read/'+chapterMeta[chapter].id);requestAnimationFrame(()=>{if(chapter===0)scrollTo(0,0);else document.getElementById('read-'+chapterMeta[chapter].id).scrollIntoView({behavior:'instant',block:'start'})});}
 hash(value){history.replaceState(null,'','#'+value)}
 route(){const [kind,id]=decodeURIComponent(location.hash.slice(1)).split('/');if(kind==='read'){let i=chapterMeta.findIndex(c=>c.id===id);this.read(i<0?0:i,false)}else{let i=slidesMeta.findIndex(c=>c.id===id);this.index=i<0?0:i;if(this.isCompact())this.read(slidesMeta[this.index].chapter);else this.navigate(this.index,false)}}
 updateModule(index,focus=false){this.moduleIndex=index;const m=moduleData[index];document.querySelectorAll('.cap-tab').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1});document.getElementById('cap-panel').setAttribute('aria-labelledby','cap-tab-'+index);document.getElementById('cap-panel').innerHTML=`<div class="cap-panel-header"><h3>${m.title}</h3>${statusHtml(m.status)}</div><ul>${m.lines.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;if(focus)document.getElementById('cap-tab-'+index).focus();}
 focusLayer(layer){const map=document.getElementById('architecture-map');map.dataset.focus=layer;map.querySelectorAll('.arch-row').forEach(r=>{r.classList.toggle('focused',r.dataset.layer===layer);r.querySelector('button').setAttribute('aria-pressed',String(r.dataset.layer===layer))});}
 setSection(index,open){const p=document.getElementById('read-body-'+index),b=document.querySelector(`[aria-controls="read-body-${index}"]`);p.hidden=!open;b.setAttribute('aria-expanded',String(open));b.textContent=open?'收起 −':'展开 +';}
 markReadChapter(index){document.querySelectorAll('[data-read-chapter]').forEach(a=>a.setAttribute('aria-current',String(Number(a.dataset.readChapter)===index)))}
 openModule(index){this.dialogIndex=index;const m=moduleData[index];document.getElementById('dialog-title').textContent=m.title;document.getElementById('dialog-list').innerHTML=m.lines.map(t=>`<li>${esc(t)}</li>`).join('');document.getElementById('dialog-status').innerHTML=statusHtml(m.status);document.getElementById('module-dialog').showModal();}
 async fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch{this.toast('可使用浏览器的全屏功能继续汇报。')}}
 toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>el.hidden=true,3500)}
 clearMarks(){document.querySelectorAll('#read-sections mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));document.getElementById('read-sections').normalize();}
 search(query){this.clearMarks();const q=query.trim().toLocaleLowerCase();let hits=0,sections=0;document.querySelectorAll('.read-section').forEach((section,i)=>{const matches=!q||section.textContent.toLocaleLowerCase().includes(q);section.hidden=!matches;if(matches){sections++;if(q){this.setSection(i,true);section.querySelectorAll('details').forEach(d=>d.open=true);const walker=document.createTreeWalker(section.querySelector('.read-section-body'),NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{const text=node.nodeValue,lower=text.toLocaleLowerCase();if(!lower.includes(q))return;const frag=document.createDocumentFragment();let p=0,k;while((k=lower.indexOf(q,p))!==-1){frag.append(document.createTextNode(text.slice(p,k)));const m=document.createElement('mark');m.textContent=text.slice(k,k+q.length);frag.append(m);p=k+q.length;hits++}frag.append(document.createTextNode(text.slice(p)));node.replaceWith(frag)})}}});document.getElementById('no-results').hidden=sections!==0;document.getElementById('clear-search').hidden=!q;document.getElementById('search-summary').hidden=!q;document.getElementById('search-summary').textContent=`找到 ${hits} 处匹配，涉及 ${sections} 个章节`;if(q){const first=document.querySelector('.read-section:not([hidden])');if(first)first.scrollIntoView({behavior:'instant',block:'start'})}}
 preparePrint(){this.printSnapshot={mode:this.mode,index:this.index,hash:location.hash,query:document.getElementById('search').value,scroll:scrollY,sections:range(5).map(i=>!document.getElementById('read-body-'+i).hidden),details:[...document.querySelectorAll('.read-module')].map(d=>d.open)};this.search('');range(5).forEach(i=>this.setSection(i,true));document.querySelectorAll('.read-module').forEach(d=>d.open=true);document.getElementById('reader').hidden=false;}
 restorePrint(){const s=this.printSnapshot;if(!s)return;this.printSnapshot=null;if(s.mode==='present')this.navigate(s.index,false);else this.read(chapterMeta.findIndex(c=>s.hash.includes(c.id))<0?0:chapterMeta.findIndex(c=>s.hash.includes(c.id)),false);s.sections.forEach((v,i)=>this.setSection(i,v));document.querySelectorAll('.read-module').forEach((d,i)=>d.open=s.details[i]);document.getElementById('search').value=s.query;this.search(s.query);history.replaceState(null,'',s.hash);requestAnimationFrame(()=>scrollTo(0,s.scroll));}
 bind(){document.getElementById('prev').onclick=()=>this.navigate(this.index-1);document.getElementById('next').onclick=()=>this.navigate(this.index+1);document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>this.navigate(chapterMeta[Number(b.dataset.chapter)].slide));document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>this.navigate(Number(b.dataset.slide)));document.getElementById('brand-home').onclick=()=>this.isCompact()?this.read(0):this.navigate(0);document.getElementById('read-mode').onclick=()=>this.read();document.getElementById('roadmap-read').onclick=()=>this.read(4);document.getElementById('present-mode').onclick=()=>{scrollTo(0,0);this.navigate(this.index)};document.getElementById('fullscreen').onclick=()=>this.fullscreen();document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>this.openModule(Number(b.dataset.module)));document.getElementById('dialog-close').onclick=()=>document.getElementById('module-dialog').close();document.getElementById('module-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});document.getElementById('dialog-more').onclick=()=>{document.getElementById('module-dialog').close();this.navigate(2);this.updateModule(this.dialogIndex)};document.querySelectorAll('[data-cap]').forEach(b=>{b.onclick=()=>this.updateModule(Number(b.dataset.cap));b.onkeydown=e=>{if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();let n=e.key==='Home'?0:e.key==='End'?5:(Number(b.dataset.cap)+(e.key==='ArrowDown'?1:5))%6;this.updateModule(n,true)}}});document.querySelectorAll('[data-focus-layer]').forEach(b=>b.onclick=()=>this.focusLayer(b.getAttribute('aria-pressed')==='true'?'all':b.dataset.focusLayer));document.getElementById('reset-focus').onclick=()=>this.focusLayer('all');document.querySelectorAll('.fold-section').forEach((b,i)=>b.onclick=()=>this.setSection(i,b.getAttribute('aria-expanded')!=='true'));document.getElementById('expand-all').onclick=()=>{range(5).forEach(i=>this.setSection(i,true));document.querySelectorAll('.read-module').forEach(d=>d.open=true)};document.getElementById('collapse-all').onclick=()=>range(5).forEach(i=>this.setSection(i,false));document.getElementById('search').addEventListener('input',e=>this.search(e.target.value));document.getElementById('clear-search').onclick=()=>{document.getElementById('search').value='';this.search('');document.getElementById('search').focus()};document.getElementById('read-menu-toggle').onclick=()=>{const s=document.getElementById('read-sidebar'),open=s.classList.toggle('open');document.getElementById('read-menu-toggle').setAttribute('aria-expanded',String(open))};document.querySelectorAll('[data-read-chapter]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById('search').value='';this.search('');this.read(Number(a.dataset.readChapter));document.getElementById('read-sidebar').classList.remove('open');document.getElementById('read-menu-toggle').setAttribute('aria-expanded','false')});document.getElementById('print').onclick=()=>window.print();addEventListener('beforeprint',()=>this.preparePrint());addEventListener('afterprint',()=>this.restorePrint());addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').setAttribute('aria-label',document.fullscreenElement?'退出全屏':'进入全屏'));addEventListener('hashchange',()=>this.route());addEventListener('resize',()=>{if(this.isCompact()&&this.mode==='present'){document.getElementById('module-dialog').close();this.read()}document.getElementById('present-mode').hidden=this.isCompact()});addEventListener('keydown',e=>{const el=e.target;if(el.closest('input,textarea,[contenteditable=true],[role=tablist]')||document.getElementById('module-dialog').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();this.read();document.getElementById('search').focus();return}if(this.mode!=='present')return;if(['ArrowRight','PageDown','ArrowDown'].includes(e.key)||(e.key===' '&&!el.closest('button,a'))){e.preventDefault();this.navigate(this.index+1)}if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){e.preventDefault();this.navigate(this.index-1)}if(e.key==='Home'){e.preventDefault();this.navigate(0)}if(e.key==='End'){e.preventDefault();this.navigate(7)}if(e.key.toLowerCase()==='f')this.fullscreen();if(e.key.toLowerCase()==='r')this.read()});addEventListener('wheel',e=>{if(this.mode!=='present'||document.getElementById('module-dialog').open)return;e.preventDefault();if(Date.now()<this.busyUntil)return;this.wheelDelta+=e.deltaY;clearTimeout(this.wheelReset);this.wheelReset=setTimeout(()=>this.wheelDelta=0,180);if(Math.abs(this.wheelDelta)>65){this.navigate(this.index+(this.wheelDelta>0?1:-1));this.wheelDelta=0;this.busyUntil=Date.now()+650}},{passive:false});let touch=null;addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});addEventListener('touchend',e=>{if(!touch||this.mode!=='present'||document.getElementById('module-dialog').open)return;const dx=touch.x-e.changedTouches[0].clientX,dy=touch.y-e.changedTouches[0].clientY;if(Math.max(Math.abs(dx),Math.abs(dy))>70)this.navigate(this.index+((Math.abs(dx)>Math.abs(dy)?dx:dy)>0?1:-1));touch=null},{passive:true});addEventListener('scroll',()=>{if(this.mode!=='read')return;let active=0;document.querySelectorAll('.read-section').forEach((s,i)=>{if(!s.hidden&&s.getBoundingClientRect().top<150)active=i});this.markReadChapter(active)},{passive:true});}
}
window.blueprint=new PresentationController();
